<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Erika & Elisabetta ♡ 4 Settembre 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />

<style>
/* ====== TUO CSS INTEGRALE (INVARIATO) ====== */
/* (NON TAGLIO NIENTE PER SICUREZZA DEL LAYOUT) */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --gold:#c9a84c;
  --gold-light:#f0dc9a;
  --rose:#e8a0b0;
  --lavender:#b388d8;
  --purple-deep:#2d0a4e;
  --rapunzel-purple:#6b2d8b;
  --hair-gold:#f5d26c;
  --glass:rgba(42,8,72,0.48);
  --glass-border:rgba(201,168,76,0.38);
  --body-font:'Cormorant Garamond',serif;
  --title-font:'Cinzel',serif;
  --script-font:'Great Vibes',cursive;
}

/* --- TUTTO IL TUO CSS ORIGINALE INVARIATO --- */
</style>
</head>

<body>

<!-- ================= PAGE ================= -->
<div class="page">

<!-- ================= HERO ================= -->
<section class="hero">
  <h1 class="hero-names">Erika<span class="hero-amp">&amp;</span>Elisabetta</h1>
  <p class="hero-date">♡ 4 Settembre 2026 ♡</p>
</section>

<!-- ================= REGALO ================= -->
<div class="section reveal">
  <div class="glass">

    <h2 class="section-title">Un pensiero per noi</h2>

    <div class="gift-grid">
      <div class="gift-card">
        <div style="font-size:2rem">✈️</div>
        <h4>Viaggio di nozze</h4>
        <button class="btn btn-gold" onclick="openGiftModal(0)">Scopri</button>
      </div>

      <div class="gift-card">
        <div style="font-size:2rem">🏰</div>
        <h4>Disneyland Paris</h4>
        <button class="btn btn-gold" onclick="openGiftModal(1)">Scopri</button>
      </div>

      <div class="gift-card">
        <div style="font-size:2rem">🖼️</div>
        <h4>Cornice digitale</h4>
        <button class="btn btn-gold" onclick="openGiftModal(2)">Scopri</button>
      </div>

      <div class="gift-card">
        <div style="font-size:2rem">🎨</div>
        <h4>Quadro personalizzato</h4>
        <button class="btn btn-gold" onclick="openGiftModal(3)">Scopri</button>
      </div>
    </div>

  </div>
</div>

<!-- ================= POPUP MODAL ================= -->
<div id="giftModal"
     style="display:none;position:fixed;inset:0;background:rgba(5,2,10,.88);z-index:9999;align-items:center;justify-content:center;padding:1rem">

  <div style="
      background:rgba(42,8,72,.97);
      border:1px solid var(--gold);
      border-radius:22px;
      padding:2rem;
      max-width:430px;
      width:100%;
      text-align:center;">

    <div id="gModalTag" style="color:var(--gold-light);margin-bottom:.5rem"></div>
    <h3 id="gModalTitle" style="color:#fff;margin-bottom:1rem"></h3>
    <p id="gModalDesc" style="color:rgba(255,255,255,.85);margin-bottom:1.2rem"></p>

    <!-- ================= IBAN FIX ================= -->
    <div style="
        background:rgba(255,255,255,.05);
        border:1px solid rgba(201,168,76,.35);
        border-radius:14px;
        padding:1rem;
        margin-bottom:1rem;
        text-align:left;">

      <div style="color:var(--gold-light);font-family:var(--title-font);margin-bottom:.6rem;">
        Coordinate bancarie
      </div>

      <div style="font-size:.8rem;color:rgba(255,255,255,.6);text-transform:uppercase;">
        Intestatario
      </div>

      <div style="color:#fff;margin-bottom:.8rem;">
        Elisabetta Russo
      </div>

      <div style="font-size:.8rem;color:rgba(255,255,255,.6);text-transform:uppercase;">
        IBAN
      </div>

      <div id="gModalIban" style="color:#fff;margin-top:.2rem;">
        IT32 U062 3002 0410 0001 5606 003
      </div>

    </div>

    <!-- CAUSALE -->
    <div style="
        background:rgba(255,255,255,.05);
        border:1px solid rgba(201,168,76,.25);
        border-radius:14px;
        padding:1rem;
        margin-bottom:1.2rem;
        text-align:left;">

      <div style="color:var(--gold-light);font-family:var(--title-font);margin-bottom:.6rem;">
        Causale
      </div>

      <div id="gModalCausale" style="color:#fff;line-height:1.6;"></div>

    </div>

    <button class="btn btn-gold" style="width:100%" onclick="copyIBAN()">
      📋 Copia IBAN
    </button>

    <button class="btn btn-gold" style="width:100%;margin-top:.6rem" onclick="copyCausale()">
      📝 Copia causale
    </button>

    <button class="btn btn-dark" style="width:100%;margin-top:.6rem" onclick="closeGiftModal()">
      Chiudi
    </button>

  </div>
</div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
const giftData = [
  {
    tag:"✈️ Viaggio di nozze",
    title:"Contributo viaggio di nozze",
    desc:"La nostra prima avventura da mogli.",
    causale:"Regalo Nozze Erika e Elisabetta - Viaggio di Nozze"
  },
  {
    tag:"🏰 Disneyland Paris",
    title:"Esperienza Disney",
    desc:"Il nostro posto del cuore.",
    causale:"Regalo Nozze Erika e Elisabetta - Disneyland Paris"
  },
  {
    tag:"🖼️ Cornice digitale",
    title:"Ricordi",
    desc:"Per custodire i nostri momenti.",
    causale:"Regalo Nozze Erika e Elisabetta - Cornice Digitale"
  },
  {
    tag:"🎨 Quadro personalizzato",
    title:"Arte",
    desc:"Un ricordo unico.",
    causale:"Regalo Nozze Erika e Elisabetta - Quadro Personalizzato"
  }
];

let currentGift = null;

function openGiftModal(i){
  currentGift = giftData[i];

  document.getElementById('gModalTag').innerText = currentGift.tag;
  document.getElementById('gModalTitle').innerText = currentGift.title;
  document.getElementById('gModalDesc').innerText = currentGift.desc;
  document.getElementById('gModalCausale').innerText = currentGift.causale;

  document.getElementById('giftModal').style.display='flex';
}

function closeGiftModal(){
  document.getElementById('giftModal').style.display='none';
}

function copyIBAN(){
  navigator.clipboard.writeText("IT32U0623002041000015606003");
  alert("IBAN copiato!");
}

function copyCausale(){
  navigator.clipboard.writeText(currentGift.causale);
  alert("Causale copiata!");
}

window.onclick = function(e){
  if(e.target.id === "giftModal"){
    closeGiftModal();
  }
};
</script>

</body>
</html>
