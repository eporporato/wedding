<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Erika & Elisabetta ♡ 4 Settembre 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --gold:#c9a84c;
  --gold-light:#f0dc9a;
  --rose:#e8a0b0;
  --lavender:#b388d8;
  --purple-deep:#2d0a4e;
  --body-font:'Cormorant Garamond',serif;
  --title-font:'Cinzel',serif;
  --script-font:'Great Vibes',cursive;
}

body{
  font-family:var(--body-font);
  background:#0a0410;
  color:#fff;
  overflow-x:hidden;
}

/* ===== HERO ===== */
.hero{
  min-height:60vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:3rem 1rem;
}

.hero-names{
  font-family:var(--script-font);
  font-size:4rem;
  color:#fff;
}

.hero-date{
  margin-top:1rem;
  font-family:var(--script-font);
  font-size:2rem;
  color:var(--gold-light);
}

/* ===== SECTIONS ===== */
.section{
  max-width:900px;
  margin:0 auto;
  padding:2rem 1rem;
}

.glass{
  background:rgba(42,8,72,.5);
  border:1px solid rgba(201,168,76,.3);
  border-radius:20px;
  padding:2rem;
}

/* ===== GIFTS ===== */
.gift-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1rem;
  margin-top:1rem;
}

.gift-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(201,168,76,.25);
  border-radius:16px;
  padding:1rem;
  text-align:center;
}

.btn{
  background:var(--gold);
  border:none;
  padding:.6rem 1rem;
  border-radius:30px;
  cursor:pointer;
  font-family:var(--title-font);
}

/* ===== MODAL ===== */
#giftModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  justify-content:center;
  align-items:center;
  padding:1rem;
  z-index:9999;
}

.modal-box{
  background:rgba(42,8,72,.95);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:2rem;
  width:100%;
  max-width:420px;
}

.small-label{
  font-size:.75rem;
  opacity:.6;
  text-transform:uppercase;
}

/* ===== IBAN FIX ===== */
.iban-box{
  margin-top:1rem;
  padding:1rem;
  border-radius:12px;
  border:1px solid rgba(201,168,76,.3);
  background:rgba(255,255,255,.05);
}

</style>
</head>

<body>

<div class="hero">
  <div class="hero-names">Erika & Elisabetta</div>
  <div class="hero-date">4 Settembre 2026</div>
</div>

<!-- GIFTS -->
<div class="section">
  <div class="glass">

    <h2>Un pensiero per noi</h2>

    <div class="gift-grid">
      <div class="gift-card">
        ✈️<br><br>Viaggio di nozze<br><br>
        <button class="btn" onclick="openGift(0)">Scopri</button>
      </div>

      <div class="gift-card">
        🏰<br><br>Disneyland<br><br>
        <button class="btn" onclick="openGift(1)">Scopri</button>
      </div>

      <div class="gift-card">
        🖼️<br><br>Casa<br><br>
        <button class="btn" onclick="openGift(2)">Scopri</button>
      </div>

      <div class="gift-card">
        🎨<br><br>Arte<br><br>
        <button class="btn" onclick="openGift(3)">Scopri</button>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="giftModal" onclick="outsideClose(event)">
  <div class="modal-box">

    <div id="mTag"></div>
    <h2 id="mTitle"></h2>
    <p id="mDesc"></p>

    <!-- IBAN FIX COMPLETO -->
    <div class="iban-box">

      <div class="small-label">Intestatario</div>
      <div style="margin-bottom:.5rem">Elisabetta Russo</div>

      <div class="small-label">IBAN</div>
      <div id="mIban">IT32 U062 3002 0410 0001 5606 003</div>

    </div>

    <div class="iban-box">
      <div class="small-label">Causale</div>
      <div id="mCausale"></div>
    </div>

    <br>

    <button class="btn" onclick="copyIBAN()">Copia IBAN</button>
    <button class="btn" onclick="copyCausale()">Copia causale</button>
    <button class="btn" onclick="closeModal()">Chiudi</button>

  </div>
</div>

<script>
const gifts = [
  {
    tag:"✈️ Viaggio di nozze",
    title:"Contributo viaggio di nozze",
    desc:"La nostra prima avventura da mogli.",
    causale:"Regalo Nozze Erika e Elisabetta - Viaggio di Nozze"
  },
  {
    tag:"🏰 Disneyland",
    title:"Esperienza Disney",
    desc:"Il nostro posto del cuore.",
    causale:"Regalo Nozze Erika e Elisabetta - Disneyland Paris"
  },
  {
    tag:"🖼️ Casa",
    title:"Per la nostra casa",
    desc:"Ricordi e momenti.",
    causale:"Regalo Nozze Erika e Elisabetta - Casa"
  },
  {
    tag:"🎨 Arte",
    title:"Quadro personalizzato",
    desc:"Un’opera unica.",
    causale:"Regalo Nozze Erika e Elisabetta - Arte"
  }
];

let current = null;

function openGift(i){
  current = gifts[i];

  document.getElementById("mTag").innerText = current.tag;
  document.getElementById("mTitle").innerText = current.title;
  document.getElementById("mDesc").innerText = current.desc;
  document.getElementById("mCausale").innerText = current.causale;

  document.getElementById("giftModal").style.display="flex";
}

function closeModal(){
  document.getElementById("giftModal").style.display="none";
}

function outsideClose(e){
  if(e.target.id === "giftModal") closeModal();
}

function copyIBAN(){
  navigator.clipboard.writeText("IT32U0623002041000015606003");
  alert("IBAN copiato!");
}

function copyCausale(){
  navigator.clipboard.writeText(current.causale);
  alert("Causale copiata!");
}
</script>

</body>
</html>
